<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groszery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#ECEFEA;--card:#fff;--ink:#12201A;--mute:#59665E;--line:#D3D9D4;--field:#A6B1A9;--deep:#1F4D36;--yel:#F6C945;--selbg:#1F4D36;--selfg:#fff;--ok:#1F6B43;--warn:#B3261E;--amber:#8A5A00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1813;--card:#15241C;--ink:#EDF1EC;--mute:#A3B2A8;--line:#2A3B31;--field:#3F5448;--deep:#F6C945;--selbg:#F6C945;--selfg:#12201A;--ok:#7CCB92;--warn:#FF8B7B;--amber:#E0B252}}
:root[data-theme="dark"]{--bg:#0E1813;--card:#15241C;--ink:#EDF1EC;--mute:#A3B2A8;--line:#2A3B31;--field:#3F5448;--deep:#F6C945;--selbg:#F6C945;--selfg:#12201A;--ok:#7CCB92;--warn:#FF8B7B;--amber:#E0B252}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Archivo','Segoe UI','Helvetica Neue',Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
.lk-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lk-l{display:none}:root:not([data-theme="light"]) .lk-d{display:block}}
:root[data-theme="dark"] .lk-l{display:none}:root[data-theme="dark"] .lk-d{display:block}
.brand{margin:2px 0 14px}.brand svg{display:block;max-width:100%;height:auto}
.sub{color:var(--mute);margin:0 0 22px;max-width:56ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px}
#out .card{background:transparent;border:0;border-top:2px solid var(--ink);border-radius:0;padding:14px 0 6px;margin:30px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card>.grid>div:first-child{grid-column:1/-1}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--field);border-radius:4px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
textarea{min-height:64px;resize:vertical}
#budget{font-size:34px;font-weight:800;padding:8px 12px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:4px;padding:12px 22px;background:var(--yel);color:#12201A;min-height:46px;box-shadow:0 3px 0 #12201A}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #12201A}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--field);padding:5px 11px;font-weight:500;font-size:13px;min-height:32px;box-shadow:none}
button.ghost:active{transform:none}
button.sel{background:var(--selbg);color:var(--selfg);border-color:var(--selbg)}
button:disabled{opacity:.55;cursor:wait}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.chip{background:var(--yel);color:#12201A;border-radius:3px;padding:1px 7px;font-size:12px;font-weight:700}
.chip.mini{margin-left:6px;white-space:nowrap}
h2{font-size:21px;margin:0 0 12px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.day{border-top:1px solid var(--line);padding:12px 0}.day:first-of-type{border-top:0}
.day>b{display:block;margin-bottom:6px;font-size:15px}
.meal{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:5px 0}
.meal details.mdet{border-top:0;padding:0;flex:1}
.meal summary{font-weight:500}
.bar{height:8px;background:var(--line);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--deep)}
.bar.over i{background:var(--warn)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.bad,.err{color:var(--warn)}.ok{color:var(--ok)}.warnc{color:var(--amber)}
.cat{margin:20px 0 4px;padding-bottom:4px;font-size:15px;font-weight:800;border-bottom:1px solid var(--ink)}
.item{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15px;color:var(--ink);margin:0}
.item input{width:18px;height:18px;accent-color:var(--deep);padding:0}
.item .n{flex:1;display:flex;align-items:baseline;gap:6px}
.item .n::after{content:"";flex:1;min-width:12px;border-bottom:1px dotted var(--field);transform:translateY(-4px)}
.promo .item .n::after{display:none}
.item .p{white-space:nowrap;font-variant-numeric:tabular-nums}
.item.done .n{text-decoration:line-through;color:var(--mute)}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
ul,ol{margin:6px 0 4px 20px;padding:0}
.muted{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chk{display:flex;gap:12px;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.chk:first-of-type{border-top:0}.chk span:last-child{text-align:right}
.inline{display:flex;gap:8px}.inline input{flex:1}
.mt{margin-top:12px}
.banner{border:1px solid var(--warn);border-radius:4px;padding:10px 12px;margin-bottom:14px;color:var(--warn);font-size:13px}
.banner.soft{border-color:var(--field);color:var(--ink)}
.per{font-size:14px;font-weight:500}
details.more{border-top:0;padding:0}details.more>summary{color:var(--deep);font-size:14px;padding:6px 0}
.promo{border:1px dashed var(--field);border-radius:4px;padding:4px 12px}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
.tag{display:inline-block;background:var(--yel);color:#12201A;padding:0 8px;border-radius:3px;font-weight:800}
.hero{display:flex;align-items:center;gap:10px}
#budget{font-size:56px;font-weight:800;padding:0;border:0;background:transparent;width:3ch;max-width:70%;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .tag{font-size:22px;padding:2px 10px}#perday{margin:2px 0 0}
.seg-src{display:none}
.chips .ghost{min-height:44px;padding:10px 14px;font-size:14px}
.cta{position:sticky;bottom:0;background:var(--card);padding:12px 0 2px;margin-top:6px;z-index:2}
.sticky{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--ink);padding:12px 0;margin-top:8px}
.meal{border-top:1px solid var(--line);padding:10px 0}.day>b+.meal{border-top:0}
.item{min-height:48px}.item input{width:22px;height:22px}.item{font-weight:400}.item .p{font-weight:700}
</style>

const CHIPS=[['pantry','pchips','pq'],['allergies','achips','aq'],['dislikes','dchips','dq']];
function buildChips(){CHIPS.forEach(([ik,bk,tk])=>{const box=$(bk),inp=$(ik);if(!box||!inp)return;box.textContent='';const cur=()=>inp.value.split(',').map(x=>x.trim()).filter(Boolean);const same=(x,n)=>x.toLowerCase()===n.toLowerCase();
 t(tk).split(',').forEach(n=>{const b=el('button',{class:'ghost'+(cur().some(x=>same(x,n))?' sel':''),type:'button'},n);b.addEventListener('click',()=>{let c=cur();c=c.some(x=>same(x,n))?c.filter(x=>!same(x,n)):c.concat(n);inp.value=c.join(', ');buildChips()});box.append(b)})})}
function buildSeg(){[['days','dayc'],['diet','dietc']].forEach(([sk,bk])=>{const sel=$(sk),box=$(bk);if(!sel||!box)return;box.textContent='';[...sel.options].forEach(o=>{const b=el('button',{class:'ghost'+(sel.value===o.value?' sel':''),type:'button'},o.textContent);b.addEventListener('click',()=>{sel.value=o.value;buildSeg();perDay()});box.append(b)})})}
